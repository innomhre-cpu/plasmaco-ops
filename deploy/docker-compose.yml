# Server + PostgreSQL for a pilot or a local test. Secrets come from deploy/.env (copy .env.example; never commit .env).
# Put a TLS-terminating reverse proxy in front of port 8080: the app only accepts https:// server addresses.
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: plasmaco
      POSTGRES_USER: plasmaco
      POSTGRES_PASSWORD: ${PLASMACO_DB_PASSWORD:?set PLASMACO_DB_PASSWORD in deploy/.env}
    volumes:
      - plasmaco-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plasmaco -d plasmaco"]
      interval: 10s
      retries: 6
  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PLASMACO_DB_URL: jdbc:postgresql://db:5432/plasmaco
      PLASMACO_DB_USER: plasmaco
      PLASMACO_DB_PASSWORD: ${PLASMACO_DB_PASSWORD}
      PLASMACO_JWT_SECRET: ${PLASMACO_JWT_SECRET:?set PLASMACO_JWT_SECRET in deploy/.env}
      PLASMACO_TIME_ZONE: ${PLASMACO_TIME_ZONE:-Africa/Kigali}
      PLASMACO_ALLOW_NEGATIVE_OVERRIDE: ${PLASMACO_ALLOW_NEGATIVE_OVERRIDE:-false}
      PLASMACO_BOOTSTRAP_ADMIN_USERNAME: ${PLASMACO_BOOTSTRAP_ADMIN_USERNAME:-}
      PLASMACO_BOOTSTRAP_ADMIN_PASSWORD: ${PLASMACO_BOOTSTRAP_ADMIN_PASSWORD:-}
    ports:
      - "127.0.0.1:8080:8080"
volumes:
  plasmaco-db:
